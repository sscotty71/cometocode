- name: Disabilitare swap
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Commentare swap in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\S+\s+swap\s+\S+\s+\S+\s+\S+\s+\S+)$'
    replace: '# \1'

- name: Impostare l'hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Aggiungere hostname in /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ ansible_default_ipv4.address }} {{ inventory_hostname }}"
    state: present

- name: Installare pacchetti di base
  ansible.builtin.apt:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - software-properties-common
    update_cache: yes

- name: Installare containerd
  apt:
    name: containerd
    state: present
    update_cache: yes

- name: Creare cartella di configurazione containerd
  file:
    path: /etc/containerd
    state: directory

- name: Generare configurazione predefinita per containerd
  shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Abilitare SystemdCgroup in containerd
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'

- name: Riavviare containerd
  systemd:
    name: containerd
    state: restarted
    enabled: yes

- name: Aggiungere chiave GPG di Kubernetes
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key | gpg --dearmor -o /usr/share/keyrings/kubernetes-archive-keyring.gpg
  args:
    executable: /bin/bash
  changed_when: false

- name: Aggiungere repository Kubernetes per Ubuntu 24.04 (Noble)
  shell: echo "deb [signed-by=/usr/share/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /" | tee /etc/apt/sources.list.d/kubernetes.list > /dev/null
  changed_when: false

- name: Aggiornare la cache di APT
  apt:
    update_cache: yes

- name: Installare kubeadm, kubelet, kubectl
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    update_cache: yes


- name: Abilitare e avviare kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: yes
    state: started


- name: Caricare il modulo kernel br_netfilter
  modprobe:
    name: br_netfilter
    state: present

- name: Assicurarsi che br_netfilter sia caricato al boot
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      br_netfilter
 

- name: Abilitare forwarding IPv4 e netfilter per Kubernetes
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1


- name: Ricaricare i parametri del kernel
  command: sysctl --system

- name: Verificare che le impostazioni siano applicate
  shell: |
    sysctl net.bridge.bridge-nf-call-iptables
    sysctl net.ipv4.ip_forward
