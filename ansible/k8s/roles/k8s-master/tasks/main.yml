- name: Inizializzare il master Kubernetes
  shell: |
    kubeadm init --pod-network-cidr=10.244.0.0/16
  args:
    creates: /etc/kubernetes/admin.conf

- name: Creare directory .kube
  file:
    path: /root/.kube
    state: directory
    mode: '0755'

- name: Copiare il file di configurazione
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: yes

- name: Generare il comando join per i worker
  shell: kubeadm token create --print-join-command
  register: join_command
  run_once: true

- name: Salvare il comando join su un file
  copy:
    content: "{{ join_command.stdout }}"
    dest: /tmp/k8s_join_command.sh
